server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:digital_garden}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-bytes-long}
    expiration-ms: 86400000
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  admin:
    default-username: ${ADMIN_USERNAME:harvey}
    default-password: ${ADMIN_PASSWORD:admin123456}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
    embedding-model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v3}
    base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  game:
    semantic:
      guess-interval-ms: 1500
      fp-guesses-per-minute: 30
      embedding-max-concurrent: 2
      nickname-cooldown-seconds: 60
